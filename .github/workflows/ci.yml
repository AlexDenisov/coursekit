name: CI

# The course's own checks. Tests aren't run here: on this branch they fail until you
# solve each exercise. Run `python3 tools/progress.py` locally to see where you are.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Curriculum and tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: curriculum.json is valid and generated docs are up to date
        run: python3 tools/sync_curriculum.py --check
      - name: Python tools compile
        run: python3 -m py_compile tools/*.py tools/runners/*.py

  build:
    name: Everything compiles (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bazel repository cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel', '.bazelversion') }}
      - name: Point Bazel at the cache
        run: echo "common --repository_cache=$HOME/.cache/bazel-repo" >> ~/.bazelrc
      - name: Build
        run: bazel build //...
      - name: Shared helpers pass
        run: bazel test //common/...
